  <text x="690" y="410" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600" fill="#F5F7FF">Faster data prep</text>
  <text x="690" y="448" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600" fill="#F5F7FF">for REDCap projects</text>
  <text x="690" y="520" font-family="Inter, Arial, sans-serif" font-size="22" fill="#C8D2E6">✓ Lightweight R package</text>
  <text x="690" y="570" font-family="Inter, Arial, sans-serif" font-size="22" fill="#C8D2E6">✓ Data labels preserved</text>
  <text x="690" y="620" font-family="Inter, Arial, sans-serif" font-size="22" fill="#C8D2E6">✓ Ready for reporting</text>

