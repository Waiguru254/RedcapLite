  <rect x="90" y="960" width="1020" height="150" rx="36" fill="#182242"/>
  <text x="130" y="1030" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="700" fill="#F5F7FF">RedcapLite</text>
  <text x="130" y="1080" font-family="Inter, Arial, sans-serif" font-size="22" fill="#C8D2E6">A lightweight R &amp; REDCap interface for modern data management</text>

  <rect x="90" y="210" width="1020" height="700" rx="40" fill="#141E3A"/>
  <text x="140" y="300" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600" fill="#F5F7FF">Why teams choose RedcapLite</text>

  <circle cx="152" cy="360" r="6" fill="#67E8F9"/>
  <text x="170" y="368" font-family="Inter, Arial, sans-serif" font-size="22" fill="#C8D2E6">Pull REDCap data via API with minimal setup</text>
  <circle cx="152" cy="420" r="6" fill="#67E8F9"/>
  <text x="170" y="428" font-family="Inter, Arial, sans-serif" font-size="22" fill="#C8D2E6">Preprocess exports with value labels and checkbox handling</text>
  <circle cx="152" cy="480" r="6" fill="#67E8F9"/>
  <text x="170" y="488" font-family="Inter, Arial, sans-serif" font-size="22" fill="#C8D2E6">Designed for longitudinal and multi-form projects</text>
  <circle cx="152" cy="540" r="6" fill="#67E8F9"/>
  <text x="170" y="548" font-family="Inter, Arial, sans-serif" font-size="22" fill="#C8D2E6">Optional compact exports and reusable RDS outputs</text>

  <rect x="660" y="260" width="400" height="560" rx="36" fill="#1E2A52"/>
  <rect x="690" y="300" width="180" height="44" rx="20" fill="#FFBF69"/>
